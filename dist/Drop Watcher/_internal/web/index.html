<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Drop Watcher</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>DROP WATCHER</h1>
      <div class="account">
        <span id="account-status">Not linked</span>
        <button id="unlink-btn">Unlink</button>
        <button id="link-btn" class="primary">Link Twitch</button>
      </div>
    </header>

    <main>
      <section class="left">
        <h2>Stream queue</h2>
        <div class="card add-row">
          <input id="url-input" type="text" placeholder="https://twitch.tv/channel" />
          <select id="mode-select">
            <option value="fixed">Fixed time</option>
            <option value="until-earned">Until drops earned</option>
          </select>
          <input id="minutes-input" type="number" min="1" max="1440" value="60" />
          <button id="add-btn" class="primary">Add</button>
        </div>
        <ul id="queue-list" class="queue-list"></ul>
        <div id="player-signin-hint" class="hint">Sign in to Twitch player before starting the queue.</div>
        <div class="controls">
          <button id="start-btn" class="primary">Start queue</button>
          <button id="play-btn">Play selected</button>
          <button id="remove-btn">Remove selected</button>
        </div>
      </section>

      <section class="right">
        <div class="card status-card">
          <div class="label">NOW WATCHING</div>
          <div id="now-watching" class="now">Queue paused</div>
          <div id="remaining" class="remaining">— remaining</div>
          <button id="stop-stream-btn" style="margin-top:8px;">Stop stream</button>
        </div>
        <div class="player-wrap card">
          <div id="player-placeholder" class="placeholder">Start the queue to load a stream here.</div>
          <iframe id="player-frame" style="display:none" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>
        <div class="controls">
          <button id="player-login-btn">Sign in to Twitch player</button>
          <button id="inventory-btn">Drops Inventory</button>
        </div>
        <div class="controls">
          <button id="confirm-btn" class="primary">I claimed Drops — next stream</button>
        </div>
        <div class="card">
          <div class="label" style="color:#a8a8b3;font-size:11px;font-weight:700;">DROP PROGRESS</div>
          <div id="drops-list" class="drops-list"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
